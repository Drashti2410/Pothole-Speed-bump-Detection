name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: { python-version: "3.13" }
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest "Pothole-Speed bump Detection Code/tests/"
      - run: docker build -t pothole-api -f "Pothole-Speed bump Detection Code/Dockerfile" .